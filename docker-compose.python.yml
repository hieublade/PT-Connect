services:
  mysql:
    image: mysql:8.0
    container_name: ptconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptconnect}
      MYSQL_USER: ${MYSQL_USER:-ptuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ptpassword}
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_py_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/trigger.sql:/docker-entrypoint-initdb.d/02_trigger.sql:ro
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ptconnect-net

  backend-py:
    build:
      context: ./backend-py
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/hieublade}/ptconnect-backend-py:${IMAGE_TAG:-latest}
    container_name: ptconnect-backend-py
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ptconnect}
      DB_USER: ${MYSQL_USER:-ptuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ptpassword}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/public/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./backend-py/uploads:/app/uploads
    networks:
      - ptconnect-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/hieublade}/ptconnect-frontend:${IMAGE_TAG:-latest}
    container_name: ptconnect-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      BACKEND_URL: http://backend-py:8080
    ports:
      - "8501:8501"
    depends_on:
      backend-py:
        condition: service_healthy
    volumes:
      - ./frontend/static:/app/static
    networks:
      - ptconnect-net

volumes:
  mysql_py_data:

networks:
  ptconnect-net:
    driver: bridge
