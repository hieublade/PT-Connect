services:
  mysql:
    image: mysql:8.0
    container_name: ptconnect_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ptconnect
      MYSQL_USER: ptuser
      MYSQL_PASSWORD: ptpassword
    ports:
      - "3307:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: