name: PT-Connect Python CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/ptconnect-backend-py
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/ptconnect-frontend

jobs:
  # =========================================================================
  # STAGE 1: CI - Kiểm tra chất lượng code (Ruff) & Chạy 80 bài Unit Test (Pytest)
  # =========================================================================
  ci-test:
    name: "1. Lint & Pytest (80 Tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-py

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend-py/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check app tests

      - name: Run Pytest Suite (SQLite In-Memory + BCNF Integrity)
        run: pytest -v --tb=short

  # =========================================================================
  # STAGE 2: CD Build - Đóng gói Docker Image cho Backend FastAPI & Frontend Streamlit
  # =========================================================================
  build-and-push:
    name: "2. Build & Push Docker Images"
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-py
          file: ./backend-py/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Streamlit Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # STAGE 3: CD Deploy - Tự động kéo Image mới về Server & Khởi động lại Container
  # =========================================================================
  deploy:
    name: "3. Deploy to Server via Docker Compose"
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/refactor-bcnf-python-database'

    steps:
      - name: Deploy over SSH (if DEPLOY_HOST is configured)
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/PT-Connect
            git pull origin ${{ github.ref_name }}
            docker compose -f docker-compose.python.yml pull
            docker compose -f docker-compose.python.yml up -d --remove-orphans
            docker image prune -f
